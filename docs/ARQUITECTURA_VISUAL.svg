<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Arquitectura visual del Sistema de Cobros</title>
  <desc id="description">Comparación del armazón simétrico de la aplicación en escritorio y móvil, con navegación, encabezado, indicadores, filtros, contenido y acciones.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#18302f" flood-opacity="0.12"/>
    </filter>
    <style>
      .title{font:600 30px system-ui,sans-serif;fill:#18302f}.subtitle{font:400 15px system-ui,sans-serif;fill:#526866}
      .label{font:600 13px system-ui,sans-serif;fill:#18302f}.small{font:500 12px system-ui,sans-serif;fill:#526866}
      .nav{font:500 13px system-ui,sans-serif;fill:#f2f7f6}.mono{font:500 15px ui-monospace,monospace;fill:#18302f}
      .frame{fill:#fff;stroke:#dce5e2;stroke-width:2}.surface{fill:#fff;stroke:#dce5e2;stroke-width:1.5}
      .base{fill:#f4f7f6}.sidebar{fill:#172f35}.primary{fill:#17675d}.muted{fill:#dce5e2}.soft{fill:#eaf3f1}
      .rule{stroke:#dce5e2;stroke-width:1.5}.guide{stroke:#8cb8b0;stroke-width:1;stroke-dasharray:5 6;opacity:.8}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f4f7f6"/>
  <text x="50" y="52" class="title">Sistema visual · libro mayor operativo</text>
  <text x="50" y="80" class="subtitle">Una geometría compartida para listados, formularios, detalles y operaciones financieras.</text>

  <!-- Desktop -->
  <g filter="url(#shadow)">
    <rect x="50" y="120" width="1020" height="690" rx="18" class="frame"/>
    <path d="M68 120h202v690H68a18 18 0 0 1-18-18V138a18 18 0 0 1 18-18Z" class="sidebar"/>
    <rect x="270" y="120" width="800" height="64" fill="#ffffff"/>
    <line x1="270" y1="184" x2="1070" y2="184" class="rule"/>
  </g>

  <text x="78" y="162" class="nav" style="font-size:18px">COBROS</text>
  <rect x="78" y="205" width="164" height="42" rx="8" fill="#25464b"/>
  <text x="98" y="231" class="nav">Inicio</text>
  <text x="98" y="283" class="nav">Clientes</text>
  <text x="98" y="327" class="nav">Cartera</text>
  <text x="98" y="371" class="nav">Pagos</text>
  <text x="98" y="415" class="nav">Mi caja</text>
  <text x="98" y="459" class="nav">Seguimiento</text>
  <text x="98" y="503" class="nav">Reportes</text>
  <text x="98" y="755" class="nav">Configuración</text>

  <text x="302" y="159" class="small">Viernes, 11 de septiembre</text>
  <circle cx="1019" cy="152" r="18" class="soft"/>
  <text x="1009" y="157" class="label">CB</text>

  <rect x="302" y="220" width="4" height="72" rx="2" class="primary"/>
  <text x="326" y="239" class="small">CLIENTES / EXPEDIENTE</text>
  <text x="326" y="270" class="title" style="font-size:25px">María Pérez</text>
  <text x="326" y="292" class="small">Identidad, obligaciones y movimientos</text>
  <rect x="903" y="233" width="135" height="44" rx="8" class="primary"/>
  <text x="928" y="260" class="nav">Registrar cobro</text>

  <!-- 12-column guides -->
  <g>
    <line x1="302" y1="316" x2="302" y2="780" class="guide"/>
    <line x1="361" y1="316" x2="361" y2="780" class="guide"/>
    <line x1="420" y1="316" x2="420" y2="780" class="guide"/>
    <line x1="479" y1="316" x2="479" y2="780" class="guide"/>
    <line x1="538" y1="316" x2="538" y2="780" class="guide"/>
    <line x1="597" y1="316" x2="597" y2="780" class="guide"/>
    <line x1="656" y1="316" x2="656" y2="780" class="guide"/>
    <line x1="715" y1="316" x2="715" y2="780" class="guide"/>
    <line x1="774" y1="316" x2="774" y2="780" class="guide"/>
    <line x1="833" y1="316" x2="833" y2="780" class="guide"/>
    <line x1="892" y1="316" x2="892" y2="780" class="guide"/>
    <line x1="951" y1="316" x2="951" y2="780" class="guide"/>
    <line x1="1010" y1="316" x2="1010" y2="780" class="guide"/>
  </g>

  <rect x="302" y="326" width="224" height="98" rx="10" class="surface"/>
  <text x="322" y="354" class="small">SALDO PENDIENTE</text>
  <text x="322" y="390" class="mono" style="font-size:25px">USD 1.248,00</text>
  <text x="322" y="411" class="small">3 obligaciones</text>
  <rect x="550" y="326" width="224" height="98" rx="10" class="surface"/>
  <text x="570" y="354" class="small">VENCIDO</text>
  <text x="570" y="390" class="mono" style="font-size:25px">USD 348,00</text>
  <text x="570" y="411" class="small">Desde 04/09/2026</text>
  <rect x="798" y="326" width="240" height="98" rx="10" class="surface"/>
  <text x="818" y="354" class="small">ESTADO</text>
  <rect x="818" y="370" width="84" height="26" rx="13" class="soft"/>
  <text x="836" y="388" class="label" style="fill:#17675d">Activo</text>

  <rect x="302" y="448" width="736" height="58" rx="10" class="surface"/>
  <rect x="322" y="461" width="250" height="32" rx="7" class="base"/>
  <text x="338" y="482" class="small">Buscar movimientos</text>
  <rect x="906" y="461" width="112" height="32" rx="7" class="base"/>
  <text x="934" y="482" class="small">Filtrar</text>

  <rect x="302" y="530" width="736" height="234" rx="10" class="surface"/>
  <rect x="302" y="530" width="736" height="44" rx="10" fill="#f4f7f6"/>
  <text x="322" y="557" class="small">FECHA</text><text x="452" y="557" class="small">CONCEPTO</text>
  <text x="780" y="557" class="small">ESTADO</text><text x="930" y="557" class="small">IMPORTE</text>
  <line x1="302" y1="574" x2="1038" y2="574" class="rule"/>
  <line x1="302" y1="625" x2="1038" y2="625" class="rule"/>
  <line x1="302" y1="676" x2="1038" y2="676" class="rule"/>
  <line x1="302" y1="727" x2="1038" y2="727" class="rule"/>
  <text x="322" y="606" class="small">10/09/2026</text><text x="452" y="606" class="label">Servicio mensual</text><text x="780" y="606" class="small">Pendiente</text><text x="922" y="606" class="mono">350,00</text>
  <text x="322" y="657" class="small">05/09/2026</text><text x="452" y="657" class="label">Abono recibido</text><text x="780" y="657" class="small">Confirmado</text><text x="922" y="657" class="mono">−120,00</text>
  <text x="322" y="708" class="small">01/09/2026</text><text x="452" y="708" class="label">Documento 001-024</text><text x="780" y="708" class="small">Parcial</text><text x="922" y="708" class="mono">1.018,00</text>

  <text x="50" y="846" class="label">ESCRITORIO · 12 COLUMNAS</text>
  <text x="50" y="869" class="small">Navegación estable · encabezado alineado · bloques opcionales sin alterar el ritmo</text>

  <!-- Mobile -->
  <g filter="url(#shadow)">
    <rect x="1130" y="120" width="420" height="690" rx="28" class="frame"/>
    <rect x="1130" y="120" width="420" height="64" rx="28" fill="#ffffff"/>
    <line x1="1130" y1="184" x2="1550" y2="184" class="rule"/>
  </g>
  <rect x="1154" y="140" width="28" height="24" rx="5" class="base"/>
  <text x="1200" y="158" class="label">COBROS</text>
  <circle cx="1510" cy="152" r="17" class="soft"/>
  <text x="1500" y="157" class="small">CB</text>

  <rect x="1154" y="216" width="4" height="70" rx="2" class="primary"/>
  <text x="1174" y="233" class="small">CLIENTES</text>
  <text x="1174" y="261" class="title" style="font-size:23px">María Pérez</text>
  <text x="1174" y="284" class="small">Expediente del cliente</text>
  <rect x="1154" y="310" width="372" height="44" rx="8" class="primary"/>
  <text x="1288" y="338" class="nav">Registrar cobro</text>

  <rect x="1154" y="378" width="178" height="92" rx="10" class="surface"/>
  <text x="1170" y="404" class="small">PENDIENTE</text>
  <text x="1170" y="435" class="mono" style="font-size:19px">1.248,00</text>
  <rect x="1348" y="378" width="178" height="92" rx="10" class="surface"/>
  <text x="1364" y="404" class="small">VENCIDO</text>
  <text x="1364" y="435" class="mono" style="font-size:19px">348,00</text>

  <rect x="1154" y="494" width="372" height="44" rx="8" class="base"/>
  <text x="1170" y="522" class="small">Buscar movimientos</text>

  <rect x="1154" y="562" width="372" height="82" rx="10" class="surface"/>
  <text x="1170" y="587" class="small">10/09/2026 · PENDIENTE</text>
  <text x="1170" y="615" class="label">Servicio mensual</text><text x="1432" y="615" class="mono">350,00</text>
  <rect x="1154" y="660" width="372" height="82" rx="10" class="surface"/>
  <text x="1170" y="685" class="small">05/09/2026 · CONFIRMADO</text>
  <text x="1170" y="713" class="label">Abono recibido</text><text x="1430" y="713" class="mono">−120,00</text>

  <text x="1130" y="846" class="label">MÓVIL · 4 COLUMNAS</text>
  <text x="1130" y="869" class="small">Misma jerarquía · acciones apiladas · registros legibles</text>

  <!-- Footer legend -->
  <line x1="50" y1="916" x2="1550" y2="916" class="rule"/>
  <rect x="50" y="946" width="16" height="16" rx="3" class="primary"/><text x="77" y="959" class="small">Acción y línea contable</text>
  <rect x="282" y="946" width="16" height="16" rx="3" class="sidebar"/><text x="309" y="959" class="small">Navegación</text>
  <rect x="444" y="946" width="16" height="16" rx="3" class="base"/><text x="471" y="959" class="small">Plano de trabajo</text>
  <rect x="648" y="946" width="16" height="16" rx="3" class="surface"/><text x="675" y="959" class="small">Unidad de contenido</text>
  <text x="1175" y="959" class="small">Base geométrica: 8 px</text>
</svg>
